<!DOCTYPE html>
<html>
    <head><meta charset="utf-8">
        <title>리스트 만들기</title>
        <style>
            #list{
                background-image: url("media/worldmap.png");
                width: 567;
                color: darkblue;
            }
            #list ul{
                margin: 0;
                padding-right: 10px;
            }
            #list ul li{
                list-style-type: square;
            }
            #list ul li a{
                background: aliceblue;
            }
            #list ul li:hover{
                background: yellowgreen;
            }
        </style>
    </head>
    <body>
        <h3>가보고 싶은 나라</h3>
        <hr>
        <nav id="list">
            <ul>
                <li a href="#">프랑스</li>
                <li a href="#">독일</li>
                <li a href="#">칠레</li>
                <li a href="#">남아프리카공화국</li>
            </ul>
    </body>
</html>
